<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Starting DayPulse...</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    .logo-container {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(5, 150, 105, 0.05));
      border: 1px solid rgba(16, 185, 129, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 30px rgba(16, 185, 129, 0.15);
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(39, 39, 42, 0.8);
      border-radius: 50%;
      border-top-color: #10b981;
      animation: spin 0.9s cubic-bezier(0.65, 0.15, 0.45, 0.95) infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      color: #fafafa;
    }
    p {
      color: #71717a;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    .version {
      position: absolute;
      bottom: 24px;
      font-size: 11px;
      color: #3f3f46;
      font-weight: 600;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
      <circle cx="12" cy="12" r="4"/>
    </svg>
  </div>
  <div class="spinner"></div>
  <h1>DayPulse</h1>
  <p>Booting secure standalone workspace...</p>
  <div class="version">LOCAL v2.0.0</div>
</body>
</html>
