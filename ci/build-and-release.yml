name: Build and Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish release assets to GitHub Releases'
        required: false
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop Windows Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate --workspace=server

      - name: Build Desktop App
        run: npm run build:desktop

      - name: Package Windows Installer
        run: npm run pack:exe --workspace=desktop-app

      - name: Upload Desktop Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DayPulse-Windows-Setup
          path: desktop-app/release/DayPulse Setup *.exe
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android
        working-directory: android-app
        run: |
          node scripts/build.js
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copy APK with Clean Name
        run: |
          mkdir -p build-artifacts
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/DayPulse-debug.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DayPulse-Android-APK
          path: build-artifacts/DayPulse-debug.apk
          if-no-files-found: error

  publish-release:
    name: Publish to GitHub Releases
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Desktop Artifact
        uses: actions/download-artifact@v4
        with:
          name: DayPulse-Windows-Setup
          path: release-files

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: DayPulse-Android-APK
          path: release-files

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
