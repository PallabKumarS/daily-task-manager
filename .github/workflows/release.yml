name: Release Builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies and generate Prisma
        run: |
          npm ci
          npx prisma generate --schema=web-app/prisma/schema.prisma

      - name: Build Desktop Application
        working-directory: desktop-app
        run: npm run pack:exe

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DayPulse-Windows-Installer
          path: desktop-app/release/DayPulse Setup *.exe

  build-android:
    name: Build Android APKs
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies and generate Prisma
        run: |
          npm ci
          npx prisma generate --schema=web-app/prisma/schema.prisma

      - name: Restore Keystore from Secret
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("android-app/android/app/release.keystore", [Convert]::FromBase64String($env:KEYSTORE_BASE64))

      - name: Build Android APKs
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/build-apk.js

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DayPulse-Android-APKs
          path: android-app/release/*.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Desktop Artifact
        uses: actions/download-artifact@v4
        with:
          name: DayPulse-Windows-Installer
          path: dist

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: DayPulse-Android-APKs
          path: dist

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ github.ref_name }}
          name: DayPulse ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
